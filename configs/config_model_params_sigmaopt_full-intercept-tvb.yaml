model_name: "full_model"
sigma_opt: True

# -----------------------------------------------------
# BIRTH-DEATH-SAMPLING MODEL PARAMETERS
# -----------------------------------------------------
fit_model_params:
  # Not estimated
  death_rate: 1
  sampling_mask: "data_new/sampling_mask.csv"

  # Potentially estimated
  birth_background:
    estimate: True
    penalize: False
    value: [1.000001, 1.000001, 1.000001]
    changepoints: [2003, 2013]
  birth_features:
    estimate: True
    penalize: True
    states: "data_new/functional_groups_corr_pastml/marginal_states.csv" # Binary features file for each sample + ancestral node
    value: 1
  sampling_features:
    estimate: True
    penalize: True
    states: "data_new/meta_features_marginal.csv"
    value: 1
  sampling_background:
    estimate: True
    penalize: False
    value: [0.0001, 0.0001, 0.0001]
    changepoints: [2003, 2013]
  brownian_motion:
    estimate: True
    penalize: False
    value: 1
    states: "data_new/analysis/three_sampling_intervals/brownian_search_setup.json"

# -----------------------------------------------------
# HYPERPARAMETER SEARCH SETUP
# -----------------------------------------------------
lr: .00005
n_epochs: 80000

# Values of regularization type, lambda penalty types to test
hyper_param_values:
  reg_type: ["l1"]
  lamb: [1, 5, 10, 20]
  sigma: [0.05, 0.25, 0.5, 1]
