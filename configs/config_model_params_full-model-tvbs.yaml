model_name: "full_model_tvbs"
sigma_opt: False

# -----------------------------------------------------
# BIRTH-DEATH-SAMPLING MODEL PARAMETERS
# -----------------------------------------------------
fit_model_params:
  # Not estimated
  death_rate: 1
  sampling_mask: "../data/model_input/sampling_mask.csv"

  # Potentially estimated
  birth_background:
    estimate: True
    penalize: False
    value: [1.000001, 1.000001, 1.000001]
    changepoints: [2003, 2013]
  birth_features:
    estimate: True
    penalize: True
    states: "../data/model_input/marginal_states_genetic.csv" # Binary features file for each sample + ancestral node
    value: 1
  sampling_features:
    estimate: True
    penalize: True
    states: "../data/model_input/marginal_states_meta.csv"
    value: 1
  sampling_background:
    estimate: True
    penalize: False
    value: [0.0001, 0.0001, 0.0001]
    changepoints: [2003, 2013]
  brownian_motion:
    estimate: True
    penalize: False
    value: 1

# -----------------------------------------------------
# HYPERPARAMETER SEARCH SETUP
# -----------------------------------------------------
# Values of regularization type, lambda penalty types, etc. to test
hyper_param_values:
  lr: 0.00005
  n_epochs: 80000
  reg_type: ["l1"]
  lamb: [1, 5, 25, 50]
  sigma: [0.00005, 0.05]
